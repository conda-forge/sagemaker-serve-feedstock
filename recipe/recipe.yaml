schema_version: 1

context:
  version: "1.25.0"

package:
  name: sagemaker-serve
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sagemaker-serve/sagemaker_serve-${{ version }}.tar.gz
  sha256: 680cd82db18c9b5324388f5cbf21c911834c7a9bd850635bd7a9cebe15c22b4b

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    rm -f $SP_DIR/sagemaker/__init__.py
    rm -rf $SP_DIR/sagemaker/__pycache__

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - sagemaker-core >=2.24.0
    - sagemaker-train >=1.24.0
    - sagemaker-schema-inference-artifacts
    - boto3 >=1.42.2,<2.0
    - botocore >=1.35.75,<2.0
    # Raised lower bound from 4.25.8 to 5.29.5: databricks-sdk (via mlflow) forbids
    # protobuf 5.26-5.28.* and 5.29.0-4, so the old floor still allowed the solver to
    # pick 5.28.3 and fail `pip check`.
    - protobuf >=5.29.5,<7.0
    - deepdiff
    - mlflow
    - tqdm
    - psutil
    - tritonclient
    - onnx
    - onnxruntime
    - pytorch >=2.0.0
    - pytest

tests:
  - script:
      # sagemaker.serve's import chain reaches AIRHub, which builds boto3 clients
      # at class-definition (import) time, so a region must be set or `import
      # sagemaker.serve` raises NoRegionError. Upstream fix tracked in
      # aws/sagemaker-python-sdk PR #6401; remove this once a release includes it.
      env:
        AWS_DEFAULT_REGION: us-east-1
      content:
        - python -c "import sagemaker.serve"
        - pip check
    requirements:
      run:
        - pip

about:
  summary: SageMaker Serve package for model serving and deployment
  homepage: https://github.com/aws/sagemaker-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://sagemaker.readthedocs.io/en/stable/
  repository: https://github.com/aws/sagemaker-python-sdk

extra:
  recipe-maintainers:
    - mollyheamazon
    - mufaddal-rohawala
    - nargokul
    - aviruthen
